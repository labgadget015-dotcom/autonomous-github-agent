# GitHub Autopilot Configuration
# Target repositories for daily summary generation

repos:
  # Critical Priority - Core Product Repos
  - owner: labgadget015-dotcom
    name: autonomous-github-agent
    priority: critical
    notes: "Main autopilot repo + test coverage issues"

  - owner: labgadget015-dotcom
    name: github-multi-agent-system
    priority: critical
    notes: "Multi-agent orchestration system"

  - owner: labgadget015-dotcom
    name: ai-automation-engine
    priority: critical
    notes: "Platform backbone for agent lifecycle"

  # Medium Priority
  - owner: labgadget015-dotcom
    name: micro-bot-workflow-template
    priority: medium
    notes: "Workflow templates"

# NOTE: AI-crypto-trading-bot, ai-ops-desk, ViralVideo are intentionally
# omitted — marked "Paused" in the consolidation strategy. Scanning them wastes
# GitHub API quota (rate_limit_buffer: 100) and adds noise to the daily summary.

# Output configuration
output:
  format: markdown
  file: DAILY_SUMMARY.md
  console: true  # Also print to stdout
  include_timestamp: true

# Analysis settings for priority calculation
analysis:
  # Weights for priority scoring (higher = more important)
  priority_weights:
    urgent_label: 10      # Issues/PRs with "urgent" label
    enhancement_label: 5  # Issues/PRs with "enhancement" label
    pr_age_days: 2        # Points per day PR is open
    issue_count: 1        # Points per open issue
    recent_activity: 3    # Bonus for activity in last 24h
    critical_repo: 5      # Bonus for critical priority repos

  # Time windows
  lookback:
    commits: 24  # hours
    activity: 7  # days for "recent activity"

  # Top N priorities to show
  top_priorities: 3

# API settings
api:
  rate_limit_buffer: 100  # Keep this many API calls in reserve
  timeout: 30  # seconds
  retry_attempts: 3

# Staleness Sentinel configuration
# Controls the automated PR aging & escalation pipeline (autopilot/staleness_engine.py).
# Enable live writes by setting ENABLE_LIVE_MODE=true (dry-run is the safe default).
staleness:
  max_llm_calls_per_run: 20  # Hard cap on Claude calls per scan run

  # Tier thresholds — a PR is assigned the highest tier whose min_days it meets.
  tiers:
    - tier: 1
      min_days: 7
      label: stale
      template: tier1
    - tier: 2
      min_days: 31
      label: stale-escalated
      template: tier2
    - tier: 3
      min_days: 61
      label: stale-critical
      template: tier3

  # Comment templates (use {age_days}, {pr_title}, {repo} as placeholders).
  templates:
    tier1: |
      👋 **Staleness Sentinel** — This PR has been open for **{age_days} days**.
      Would you like any help moving it forward? If it is blocked, please add a
      `blocked` label so it can be tracked.
    tier2: |
      ⚠️ **Staleness Sentinel** — This PR has been open for **{age_days} days** without merging. Please consider:
      - Rebasing / resolving conflicts
      - Requesting a review
      - Closing it if the work has been superseded

      If this PR is still relevant, please leave a status update.
    tier3: |
      🚨 **Staleness Sentinel** — This PR has been open for **{age_days} days**. It is now critically stale. Action required:
      - **Merge** if ready
      - **Close** if no longer needed
      - **Add a comment** explaining why it must stay open

      This PR will continue to be flagged until resolved.
