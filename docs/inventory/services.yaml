    port: 443
    container_name: null  # SaaS — not self-hosted
    repo: autonomous-github-agent  # n8n-templates/ directory
    owner: platform
    criticality: critical
    healthcheck_url: https://gadgetlab.app.n8n.cloud/healthz
    creds_location: "n8n UI → Settings → n8n API  |  GitHub secret: n8n API key"
    depends_on: []
    backup_source: "n8n workflow export (JSON) — manual"
    restore_order: 10
    exposed_to:
      - internet  # webhook endpoints
      - github-actions
    observability_source:
      - n8n execution history
