    n8n_workflow_id: MRLyf7VpwE0Qc8Xp
    notes: |
      active:true but NOT processing live traffic — two hard blockers:
      1. Gemini credential (googlePalmApi) not bound on DREAMER, REALIST, CRITIC nodes
      2. Slack API OAuth credential (slackApi) not bound — different from DRC's incoming webhook
      Soft failures (silent): Nexus memory + Postgres calls hit localhost:6000 which doesn't exist,
      but both have continueRegularOutput so they won't block the flow.
      This is the workflow referenced in strategy docs as 'loop_count bug' — loop_count is
      actually correct here (increments per iteration). DRC loop is separate and linear.
      Decision needed: bind Gemini + Slack OAuth to activate, or archive.
    last_verified_at: 2026-06-24T00:00:00Z

