version: '3.9'

services:
  # Main application service
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - autonomous-github-agent:latest
    image: autonomous-github-agent:latest
    container_name: autonomous-agent-dev
    
    # Environment configuration
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - DEV_MODE=true
      - PYTHONUNBUFFERED=1
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    
    # Volume mounts for development
    volumes:
      # Mount source code for hot reload
      - ./.github:/app/.github:ro
      - ./tests:/app/tests:ro
      # Persistent data volumes
      - agent-data:/app/data
      - agent-logs:/app/logs
      # Context and results
      - ./context.json:/app/context.json:ro
      - ./results:/app/results
    
    # Networking
    networks:
      - agent-network
    
    # Resource limits (development)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Command override for development
    # command: ["python", ".github/scripts/ai_agent_main.py", "--context", "context.json"]
  
  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: autonomous-agent-prometheus
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - agent-network
    restart: unless-stopped
  
  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: autonomous-agent-grafana
    profiles:
      - monitoring
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - agent-network
    depends_on:
      - prometheus
    restart: unless-stopped
  
  # Optional: Local LLM service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: autonomous-agent-ollama
    profiles:
      - local-llm
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  agent-data:
    driver: local
  agent-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  ollama-models:
    driver: local

# Networks
networks:
  agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
