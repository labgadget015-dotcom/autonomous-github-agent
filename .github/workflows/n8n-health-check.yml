name: n8n Reachability Check

# SCOPE LIMIT - READ BEFORE TRUSTING THIS WORKFLOW'S GREEN.
# This checks REACHABILITY ONLY: that n8n Cloud is serving HTTP.
# It CANNOT detect a broken pipeline, and has already failed twice
# (2026-07-23 Normalise Issue Payload, 2026-08-22 HMAC secret unset).
#   * The DRC probe below hits the "Route Health Ping" IF node, which returns
#     Pong 200 BEFORE the auth gate and before any real work. A Pong proves
#     n8n is up. It proves NOTHING about whether GitHub events are flowing.
#   * Verified 2026-08-23: this workflow reported green while 20/20 consecutive
#     Event Router executions were erroring and 100% of events were dropped.
# The authoritative pipeline-health signal is `intake-canary.yml`, which polls
# the n8n executions API. If the two disagree, the canary is right.
#
# 2026-09-30: this check itself could not go red. A DRC 404 counted as alive,
# the Pong body was never checked, and the job failed only if BOTH the DRC
# probe AND the host root were down - and the host root answers 200 even when
# n8n refuses to run anything (the 2026-09-23 execution-quota outage: every
# ping execution errored, this job stayed green). Now the DRC probe is alive
# only on a 2xx whose body carries pong=true, with one retry for cold starts,
# and a failed DRC probe fails the job on its own.

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  # DRC + Event Router moved off n8n Cloud to the M900 on 2026-09-30 (Cloud execution
  # quota exhausted). Webhooks are public via Tailscale Funnel at /n8n/webhook/*; the rest
  # of /n8n/ sits behind Caddy basic_auth, so the host probe sees 401 = up (<500).
  DRC_WEBHOOK_URL: https://m900-homelab.tail8e0dcd.ts.net/n8n/webhook/github-agent-loop
  N8N_HOST: https://m900-homelab.tail8e0dcd.ts.net/n8n/

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n DRC webhook
        id: drc_ping
        continue-on-error: true
        run: |
          # Alive = HTTP 2xx AND the Route Health Ping -> Pong body
          # ({"status":"alive","pong":true}). A 2xx without it means n8n answered
          # but the workflow did not run (quota block, error before Pong, wrong
          # workflow on the path). One retry covers a cold start.
          probe() {
            curl -s -o /tmp/n8n_response.txt -w "%{http_code}" \
              --max-time 30 \
              -X POST "$DRC_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{"source":"health-check","event":"ping","repository":"health-monitor"}' \
              || true   # curl already printed 000 on transport failure
          }
          ALIVE=false
          for attempt in 1 2; do
            rm -f /tmp/n8n_response.txt   # never judge attempt 2 on attempt 1's body
            HTTP_STATUS=$(probe)
            echo "attempt ${attempt}: HTTP ${HTTP_STATUS}"
            head -c 500 /tmp/n8n_response.txt 2>/dev/null || true; echo
            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]] && jq -e '.pong == true' /tmp/n8n_response.txt >/dev/null 2>&1; then
              ALIVE=true
              break
            fi
            [ "$attempt" = 1 ] && sleep 20
          done
          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          echo "alive=$ALIVE" >> "$GITHUB_OUTPUT"
          if [ "$ALIVE" != "true" ]; then
            echo "::error::DRC health ping got no Pong (last HTTP '$HTTP_STATUS') - the webhook is not running the workflow"
          fi

      - name: Ping n8n GitHub Event Router
        id: router_ping
        run: |
          # Host root only: proves the server answers HTTP, nothing more.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "$N8N_HOST")
          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          echo "n8n host responded: HTTP $HTTP_STATUS"

          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 500 ]]; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Slack if n8n is down
        if: steps.drc_ping.outputs.alive != 'true' || steps.router_ping.outputs.alive == 'false'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRC_STATUS: ${{ steps.drc_ping.outputs.http_status }}
          HOST_STATUS: ${{ steps.router_ping.outputs.http_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack alert"
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"🔴 *n8n Pipeline Health Alert*\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"🔴 n8n Pipeline Unreachable\"}
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*DRC Webhook:* HTTP ${DRC_STATUS}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*n8n Host:* HTTP ${HOST_STATUS}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Impact:* the DRC webhook returned no Pong or the n8n host is down. NOTE: this check only measures reachability - see intake-canary.yml for actual pipeline health\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Action:* Check n8n.cloud status and verify workflows are active\"}
                  ]
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"View Workflow Run\"},
                      \"url\": \"${RUN_URL}\"
                    },
                    {
                      \"type\": \"button\",
                      \"text\": {\"type\": \"plain_text\", \"text\": \"n8n Dashboard\"},
                      \"url\": \"https://gadgetlab.app.n8n.cloud\"
                    }
                  ]
                }
              ]
            }" || echo "Slack alert failed (non-fatal)"

      - name: Write job summary
        if: always()
        run: |
          DRC_ALIVE=${{ steps.drc_ping.outputs.alive }}
          HOST_ALIVE=${{ steps.router_ping.outputs.alive }}
          DRC_STATUS=${{ steps.drc_ping.outputs.http_status }}
          HOST_STATUS=${{ steps.router_ping.outputs.http_status }}

          echo "## n8n Reachability (NOT pipeline health)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> This workflow only proves n8n Cloud is serving HTTP. The DRC probe" >> "$GITHUB_STEP_SUMMARY"
          echo "> hits a Pong short-circuit and cannot see a broken pipeline." >> "$GITHUB_STEP_SUMMARY"
          echo "> Authoritative signal: \`intake-canary.yml\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Endpoint | HTTP Status | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRC_ALIVE" = "true" ]; then
            echo "| DRC Webhook | \`${DRC_STATUS}\` | ✅ Pong received (reachability only) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| DRC Webhook | \`${DRC_STATUS}\` | 🔴 No Pong |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$HOST_ALIVE" = "true" ]; then
            echo "| n8n Host | \`${HOST_STATUS}\` | ✅ Up |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| n8n Host | \`${HOST_STATUS}\` | 🔴 Down |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the DRC gave no Pong or the host is down
        if: steps.drc_ping.outputs.alive != 'true' || steps.router_ping.outputs.alive == 'false'
        run: |
          echo "::error::DRC Pong missing or n8n host down"
          exit 1
