name: Release and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Update version in files
        run: |
          # Update __version__ in package
          find . -name "__init__.py" -exec sed -i 's/__version__ = ".*"/__version__ = "${{ steps.version.outputs.version }}"/g' {} +
          # Update version in setup.py if exists
          if [ -f setup.py ]; then
            sed -i 's/version=".*"/version="${{ steps.version.outputs.version }}"/g' setup.py
          fi

      - name: Build distribution
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/* --skip-existing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Autonomous GitHub Agent v${{ steps.version.outputs.version }}

            ### Features
            - AI-powered GitHub automation
            - 90% token cost reduction with local LLM routing
            - Async parallel code analysis
            - Intelligent PR inline comments
            - Auto issue creation for critical findings

            ### Installation
            ```bash
            pip install autonomous-github-agent
            ```

            ### GitHub Actions Usage
            ```yaml
            - uses: labgadget015-dotcom/autonomous-github-agent@v${{ steps.version.outputs.version }}
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                analysis_mode: auto
                local_llm_enabled: true
            ```

            ### Documentation
            - [README](https://github.com/labgadget015-dotcom/autonomous-github-agent/blob/main/README.md)
            - [Installation Guide](https://github.com/labgadget015-dotcom/autonomous-github-agent/tree/main/docs)
            - [Pricing & Monetization](https://github.com/labgadget015-dotcom/autonomous-github-agent/blob/main/docs/MONETIZATION_GUIDE.md)

            **Full Changelog**: https://github.com/labgadget015-dotcom/autonomous-github-agent/commits/v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: ./dist/*

      - name: Publish to GitHub Marketplace
        run: |
          echo "Action published successfully!"
          echo "GitHub Marketplace: https://github.com/marketplace/actions/autonomous-github-agent"
          echo "Version: v${{ steps.version.outputs.version }}"

      - name: Notify on success
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Successfully released **v${{ steps.version.outputs.version }}**\n\n🚀 Published to:\n- PyPI\n- GitHub Marketplace\n- GitHub Releases'
            })
        if: always()
