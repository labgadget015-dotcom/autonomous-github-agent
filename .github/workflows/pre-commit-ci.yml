name: Pre-commit CI Enforcement

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit on all files
        id: pre-commit
        run: |
          pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

      - name: Auto-fix and commit changes (if on PR)
        if: github.event_name == 'pull_request' && steps.pre-commit.outcome == 'failure'
        run: |
          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are changes to commit
          if ! git diff --quiet; then
            echo "Auto-fixing issues found by pre-commit hooks..."
            git add -A
            git commit -m "style: auto-fix pre-commit issues [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep $((i * 5)); done || echo "::warning::Auto-fix push failed (fork/restricted branch) — manual pull required"
          else
            echo "No auto-fixable changes found"
            echo "AUTO_FIXED=false" >> $GITHUB_ENV
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const autoFixed = process.env.AUTO_FIXED === 'true';
            const preCommitFailed = '${{ steps.pre-commit.outcome }}' === 'failure';

            let comment = '## 🔍 Pre-commit Checks\n\n';

            if (!preCommitFailed) {
              comment += '✅ All pre-commit checks passed!\n\n';
              comment += 'Your code follows the project style guidelines.';
            } else if (autoFixed) {
              comment += '🔧 Pre-commit issues were automatically fixed and committed.\n\n';
              comment += 'Please pull the latest changes before pushing again:\n';
              comment += '```bash\n';
              comment += 'git pull origin ' + context.payload.pull_request.head.ref + '\n';
              comment += '```';
            } else {
              comment += '⚠️ Pre-commit checks found issues that could not be auto-fixed.\n\n';
              comment += 'Please run the following locally to fix them:\n';
              comment += '```bash\n';
              comment += 'pre-commit run --all-files\n';
              comment += '```\n\n';
              comment += 'Or install pre-commit hooks to automatically check on commit:\n';
              comment += '```bash\n';
              comment += 'pre-commit install\n';
              comment += '```';
            }

            comment += '\n\n---\n';
            comment += '*Pre-commit hooks help maintain code quality and consistency.*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if pre-commit failed and couldn't auto-fix
        if: steps.pre-commit.outcome == 'failure' && env.AUTO_FIXED != 'true'
        run: |
          echo "::error::Pre-commit checks failed. Please run 'pre-commit run --all-files' locally to fix issues."
          exit 1

      - name: Upload pre-commit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-commit-results
          path: |
            .pre-commit-config.yaml
          retention-days: 7
