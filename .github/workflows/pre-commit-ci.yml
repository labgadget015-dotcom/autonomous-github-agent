name: Pre-commit CI Enforcement

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit on all files
        id: pre-commit
        run: |
          pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

      - name: Auto-fix and commit changes (if on PR)
        if: github.event_name == 'pull_request' && steps.pre-commit.outcome == 'failure'
        run: |
          echo "AUTO_FIXED=false" >> $GITHUB_ENV

          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet; then
            echo "No auto-fixable changes found"
            exit 0
          fi

          echo "Auto-fixing issues found by pre-commit hooks..."

          # `pre-commit run --all-files` scans the whole repo, so it can modify
          # files this PR never touched. Split what it changed into two sets.
          git diff --name-only | sort -u > "$RUNNER_TEMP/touched.txt"
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            | sort -u > "$RUNNER_TEMP/in_pr.txt"
          comm -12 "$RUNNER_TEMP/touched.txt" "$RUNNER_TEMP/in_pr.txt" > "$RUNNER_TEMP/fixable.txt"
          comm -23 "$RUNNER_TEMP/touched.txt" "$RUNNER_TEMP/in_pr.txt" > "$RUNNER_TEMP/outside.txt"

          # Files outside this PR's diff are pre-existing repo debt. Never stage
          # them (that was the #213 footgun), but DO report them - they are the
          # usual reason this job reddens a PR that did not cause the violation.
          if [ -s "$RUNNER_TEMP/outside.txt" ]; then
            echo "::warning::pre-commit modified $(wc -l < "$RUNNER_TEMP/outside.txt") file(s) OUTSIDE this PR's diff - pre-existing repo debt, deliberately not staged:"
            sed 's/^/  /' "$RUNNER_TEMP/outside.txt"
          fi

          if [ ! -s "$RUNNER_TEMP/fixable.txt" ]; then
            echo "No PR-diff files to auto-fix; skipping commit."
            exit 0
          fi

          xargs -a "$RUNNER_TEMP/fixable.txt" -d '\n' -r git add --

          # A file can be in the PR diff yet left untouched by the hooks, so the
          # add above may stage nothing at all. `git commit` then exits 1 and,
          # because GitHub runs steps under `bash -e`, kills this step for a
          # non-reason. That is the defect this guard closes.
          if git diff --cached --quiet; then
            echo "Nothing staged after add; skipping commit."
            exit 0
          fi

          git commit -m "style: auto-fix pre-commit issues [skip ci]"
          if for i in 1 2 3; do git pull --rebase origin "${{ github.head_ref }}" && git push origin "HEAD:${{ github.head_ref }}" && break || sleep $((i * 5)); done; then
            echo "AUTO_FIXED=true" >> $GITHUB_ENV
          else
            echo "::warning::Auto-fix push failed (fork/restricted branch) — manual pull required"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const autoFixed = process.env.AUTO_FIXED === 'true';
            const preCommitFailed = '${{ steps.pre-commit.outcome }}' === 'failure';

            let comment = '## 🔍 Pre-commit Checks\n\n';

            if (!preCommitFailed) {
              comment += '✅ All pre-commit checks passed!\n\n';
              comment += 'Your code follows the project style guidelines.';
            } else if (autoFixed) {
              comment += '🔧 Pre-commit issues were automatically fixed and committed.\n\n';
              comment += 'Please pull the latest changes before pushing again:\n';
              comment += '```bash\n';
              comment += 'git pull origin ' + context.payload.pull_request.head.ref + '\n';
              comment += '```';
            } else {
              comment += '⚠️ Pre-commit checks found issues that could not be auto-fixed.\n\n';
              comment += 'Please run the following locally to fix them:\n';
              comment += '```bash\n';
              comment += 'pre-commit run --all-files\n';
              comment += '```\n\n';
              comment += 'Or install pre-commit hooks to automatically check on commit:\n';
              comment += '```bash\n';
              comment += 'pre-commit install\n';
              comment += '```';
            }

            comment += '\n\n---\n';
            comment += '*Pre-commit hooks help maintain code quality and consistency.*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if pre-commit failed and couldn't auto-fix
        if: steps.pre-commit.outcome == 'failure' && env.AUTO_FIXED != 'true'
        run: |
          echo "::error::Pre-commit checks failed. Please run 'pre-commit run --all-files' locally to fix issues."
          exit 1
