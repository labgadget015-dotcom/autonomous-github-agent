name: DRC End-to-End Canary

# Proves the whole intake path works: GitHub webhook -> HMAC validation ->
# Event Router -> DRC council -> row in tim.agent_runs.
#
# Why this exists: the Event Router drops senders ending in "[bot]", so the
# nightly Daily Repository Summary issues never reach the council. Until
# 2026-09-04 the only recurring event that traversed the full path was the PR
# Triage Pipeline's daily rewrite of issue #164, which was removed because it
# re-ran the council on an unchanged premise every morning. Without this canary
# there is no routine end-to-end signal, and the Intake Canary only proves the
# n8n API is reachable, not that the path works.
#
# Cost: one council run per week.
#
# The assertion reads the audit row itself from Neon (tim.agent_runs) rather
# than any execution status. "Store to TIM Postgres" masks its own errors with
# onError=continueRegularOutput, so a failed write still reports a green
# execution - that exact failure silently dropped audit rows (issue #284).
# Reading Neon also means the canary does not depend on the n8n API, which has
# been unreachable from runners since the 2026-09-30 M900 cutover.

on:
  schedule:
    - cron: '40 7 * * 1'   # Mondays 07:40 UTC, after the 07:00 stale handler
  workflow_dispatch:

permissions:
  issues: write


jobs:
  canary:
    name: "Prove the DRC path end to end"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Record start time"
        id: t0
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "Open canary issue"
        id: open
        env:
          # GH_PAT, not GITHUB_TOKEN: the Event Router drops any sender whose
          # login ends in "[bot]", and GITHUB_TOKEN posts as github-actions[bot].
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          body=$(cat <<'EOF'
          Automated weekly canary. Safe to close.

          Context: this line is colon-led, the shape that broke the concatenated INSERT.
          Quotes: it's got 'single', "double", and \backslashes\ plus a lone $1.

          Expected: one row in tim.agent_runs for this issue number.
          EOF
          )
          url=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "[DRC CANARY] weekly end-to-end check $(date -u +%Y-%m-%d)" \
            --body "$body")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: "Wait for the council's audit row in Neon"
        id: assert
        env:
          # Read-only canary_ro role: SELECT on a few tim.* columns only.
          NEON_CANARY_DSN: ${{ secrets.NEON_CANARY_DSN }}
          SINCE: ${{ steps.t0.outputs.value }}
          ISSUE: ${{ steps.open.outputs.number }}
        run: |
          set -euo pipefail
          [ -n "${NEON_CANARY_DSN:-}" ] || { echo "::error::NEON_CANARY_DSN is not set - cannot assert the audit write."; exit 1; }
          case "$ISSUE" in ''|*[!0-9]*) echo "::error::Bad issue number '$ISSUE'"; exit 1;; esac

          q() { psql "$NEON_CANARY_DSN" -X -At -v ON_ERROR_STOP=1 -c "$1"; }

          # ~140 s per council run; allow 10 minutes.
          row=""
          for _ in $(seq 1 40); do
            row=$(q "SELECT json_build_object('id', id, 'run_id', run_id,
                       'final_priority', final_priority,
                       'final_recommendation', final_recommendation)
                     FROM tim.agent_runs
                     WHERE issue_number = $ISSUE AND created_at >= '$SINCE'::timestamptz
                     ORDER BY id DESC LIMIT 1") || { echo "::error::Neon query failed."; exit 1; }
            [ -n "$row" ] && break
            sleep 15
          done

          if [ -z "$row" ]; then
            path=$(q "SELECT string_agg(coalesce(action,'') || '->' || path, ', ' ORDER BY id)
                      FROM tim.intake_events
                      WHERE issue_number = $ISSUE AND received_at >= '$SINCE'::timestamptz") || path="<query failed>"
            echo "::error::No tim.agent_runs row for #$ISSUE within 10 minutes. Event Router logged: ${path:-NOTHING (intake never reached the router)}."
            exit 1
          fi
          echo "Audit row written: $row"

      - name: "Close the canary issue"
        if: always() && steps.open.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue close "${{ steps.open.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --reason completed \
            --comment "Canary complete. Result: ${{ steps.assert.outcome }}."

      - name: "Alert Slack on failure"
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The secrets context is not allowed in an `if`, so gate here instead.
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo "No Slack webhook configured; skipping alert."; exit 0; }
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"DRC end-to-end canary FAILED. The intake path is not delivering audit rows. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
