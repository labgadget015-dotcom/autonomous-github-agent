name: Branch Protection Setup

on:
  workflow_dispatch:  # Allow manual triggering
    inputs:
      branch_name:
        description: 'Branch to protect'
        required: false
        default: 'main'
      verify_only:
        description: 'Only verify existing protection (do not modify)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install PyGithub

      - name: Verify branch protection
        if: github.event.inputs.verify_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/setup_branch_protection.py --verify-only --branch ${{ github.event.inputs.branch_name || 'main' }}

      - name: Setup branch protection
        if: github.event.inputs.verify_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "⚠️  Note: The default GITHUB_TOKEN may not have admin permissions."
          echo "If this fails, the setup script needs to be run locally with a Personal Access Token."
          echo ""
          echo "To run manually with proper permissions:"
          echo "  export GITHUB_TOKEN='your_personal_access_token'"
          echo "  python .github/scripts/setup_branch_protection.py --branch ${{ github.event.inputs.branch_name || 'main' }}"
          echo ""
          echo "Attempting to verify current protection status..."
          python .github/scripts/setup_branch_protection.py --verify-only --branch ${{ github.event.inputs.branch_name || 'main' }} || true
