name: Intake Canary

# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#
# GitHub -> DRC intake has died silently TWICE:
#   * 2026-07-23  Event Router "Normalise Issue Payload" threw on every event
#                 (undetected 7 days)
#   * 2026-08-22  Event Router "Validate HMAC Signature" rejected 100% of
#                 traffic - GITHUB_WEBHOOK_SECRET unset (issue #259)
#
# Both times, EVERY existing signal reported GREEN during a total outage:
#
#   1. GitHub's webhook delivery log  -> 200 OK
#      The n8n Webhook node answers `onReceived` BEFORE the workflow runs, so
#      GitHub records a success and the workflow errors asynchronously after.
#      Verified 2026-08-23: delivery at 06:12:29 = 200 OK; the n8n execution it
#      spawned (6970) = status "error". The delivery log cannot see this class
#      of failure. Do not build alerting on it.
#
#   2. n8n-health-check.yml's DRC probe -> 200 OK
#      The "Route Health Ping" IF node (added 2026-07-06 to stop false
#      pipeline-down alarms) short-circuits pings to a Pong 200 BEFORE the auth
#      gate and before any real work. It proves n8n is serving HTTP. It proves
#      nothing about the pipeline. The 07-06 fix for false POSITIVES is what
#      manufactured this false NEGATIVE.
#
#   3. n8n host root -> 200 OK  (proves only that n8n Cloud is up)
#
# Signal source (since the 2026-09-30 M900 cutover): the Neon audit tables
# the pipeline itself writes - tim.intake_events (one row per delivery that
# passed HMAC) and tim.agent_runs (DRC audit write). The old source, the n8n
# Cloud executions API, is dead, and the M900's API is behind basic_auth and
# unreachable from runners. Evaluation logic + rationale:
# .github/scripts/intake_canary_neon.py
#
# This closes the v1 KNOWN GAP: a forwarded event with no audit row is a DRC
# failure even when every n8n execution reports success.
#
# KNOWN GAP (v2): router ERRORS that happen before the shadow-log node write
# nothing, so they surface as silence (<= SILENCE_THRESHOLD_HOURS), not
# within 30 minutes as before.
#
# NEON_CANARY_DSN is the read-only `canary_ro` role: column-level SELECT on the
# two tables only, default_transaction_read_only, 15s statement timeout.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Every 30 minutes. NOTE: scheduled runs only fire from the DEFAULT branch.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Guaranteed daily traffic: issue #164 is edited every morning (~06:28 UTC)
  # and the autopilot summary issue lands overnight. 26h therefore spans at
  # least one guaranteed delivery; anything shorter false-fires on weekends.
  SILENCE_THRESHOLD_HOURS: '26'
  # A DRC failure younger than this pages Slack immediately; older ones page
  # only on the ~4/day reminder gate. The job FAILS either way while the
  # unmatched event is inside the 48h lookback - never downgraded to green.
  ALERT_WINDOW_MINUTES: '60'

jobs:
  canary:
    name: GitHub -> DRC intake canary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check intake health from Neon
        id: probe
        env:
          NEON_CANARY_DSN: ${{ secrets.NEON_CANARY_DSN }}
        run: |
          set -uo pipefail

          # ~4 reminder pages/day for conditions that persist until a human
          # acts. 10# forces base-10: `08`/`09` are invalid octal.
          if [ $(( 10#$(date -u +%H) % 6 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 30 ]; then
            export REMIND=true
          else
            export REMIND=false
          fi

          broken() {
            {
              echo "status=canary_broken"
              echo "detail=$1"
              echo "slack=${REMIND}"
            } >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }

          [ -n "${NEON_CANARY_DSN:-}" ] || broken "NEON_CANARY_DSN secret is not set - the canary cannot see the pipeline."

          # DB clock (now()) is the reference for every age, not the runner's.
          SNAPSHOT=$(psql "$NEON_CANARY_DSN" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT json_build_object(
            'now', now(),
            'latest_at', (SELECT max(received_at) FROM tim.intake_events),
            'forwarded', (SELECT count(*) FROM tim.intake_events
                          WHERE path = 'forwarded'
                            AND received_at > now() - interval '48 hours'),
            'unmatched', COALESCE((
              SELECT json_agg(json_build_object(
                       'id', e.id, 'received_at', e.received_at,
                       'issue_number', e.issue_number) ORDER BY e.received_at DESC)
              FROM tim.intake_events e
              WHERE e.path = 'forwarded'
                AND e.received_at > now() - interval '48 hours'
                -- grace: Forward can time out before a slow council finishes
                AND e.received_at < now() - interval '5 minutes'
                AND NOT EXISTS (
                  SELECT 1 FROM tim.agent_runs r
                  WHERE r.issue_number = e.issue_number
                    AND r.created_at BETWEEN e.received_at - interval '15 minutes'
                                         AND e.received_at + interval '5 minutes')
            ), '[]'::json))
          SQL
          ) || broken "Neon query failed (unreachable, role/password changed, or schema changed)."

          echo "$SNAPSHOT" | python3 .github/scripts/intake_canary_neon.py

      - name: Alert Slack
        # Two distinct alert classes, because they need DIFFERENT hands:
        #   canary_broken -> a developer fixes the canary / rotates the key
        #   pipeline_down / drc_failing -> Gadget fixes the M900 n8n
        # Folding them together costs a wasted escalation every time.
        if: failure() && steps.probe.outputs.slack == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set - job status is the only signal."
            exit 0
          fi

          if [ "$STATUS" = "canary_broken" ]; then
            HEADLINE=":wrench: *INTAKE CANARY BROKEN* - the canary cannot see the pipeline."
            ACTION="Needs a developer: NEON_CANARY_DSN is missing, the canary_ro role/password changed, or the tim schema changed. Pipeline state is UNKNOWN, not healthy."
          elif [ "$STATUS" = "drc_failing" ]; then
            HEADLINE=":rotating_light: *DRC COUNCIL IS FAILING* - forwarded events produced no audit row."
            ACTION="Check the DRC Agent Loop executions on the M900 n8n (Wlfhgk4sUfXJcU4D) - Anthropic credential, token gate, or Neon write."
          else
            HEADLINE=":rotating_light: *GITHUB -> DRC INTAKE IS DOWN* - events are being dropped."
            ACTION="Needs Gadget: check the M900 n8n Event Router (oijizIGJtRzBG94Z), the GitHub webhook, and the Funnel. Note: GitHub's webhook delivery log will still show 200 OK - that is expected and does NOT mean this is a false alarm."
          fi

          jq -n \
            --arg text "${HEADLINE}"$'\n\n'"${DETAIL}"$'\n\n'"${ACTION}"$'\n\n'"<${RUN_URL}|View run>" \
            '{text: $text}' \
          | curl -s -X POST -H 'Content-Type: application/json' \
              --max-time 20 -d @- "$SLACK_WEBHOOK_URL" \
          && echo "Slack alert sent." \
          || echo "::warning::Slack post failed - job status is the backstop."
