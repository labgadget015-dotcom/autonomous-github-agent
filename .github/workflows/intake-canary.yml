name: Intake Canary

# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#
# GitHub -> DRC intake has died silently TWICE:
#   * 2026-07-23  Event Router "Normalise Issue Payload" threw on every event
#                 (undetected 7 days)
#   * 2026-08-22  Event Router "Validate HMAC Signature" rejected 100% of
#                 traffic - GITHUB_WEBHOOK_SECRET unset (issue #259)
#
# Both times, EVERY existing signal reported GREEN during a total outage:
#
#   1. GitHub's webhook delivery log  -> 200 OK
#      The n8n Webhook node answers `onReceived` BEFORE the workflow runs, so
#      GitHub records a success and the workflow errors asynchronously after.
#      Verified 2026-08-23: delivery at 06:12:29 = 200 OK; the n8n execution it
#      spawned (6970) = status "error". The delivery log cannot see this class
#      of failure. Do not build alerting on it.
#
#   2. n8n-health-check.yml's DRC probe -> 200 OK
#      The "Route Health Ping" IF node (added 2026-07-06 to stop false
#      pipeline-down alarms) short-circuits pings to a Pong 200 BEFORE the auth
#      gate and before any real work. It proves n8n is serving HTTP. It proves
#      nothing about the pipeline. The 07-06 fix for false POSITIVES is what
#      manufactured this false NEGATIVE.
#
#   3. n8n host root -> 200 OK  (proves only that n8n Cloud is up)
#
# The ONLY signal that distinguishes a healthy pipeline from a dead one is the
# n8n *executions* API. That is what this workflow polls.
#
# KNOWN GAP (deliberate, v1): this detects executions with status "error". A
# success-status LOGIC failure - events routed down a wrong branch, DRC never
# triggered - still slips through. A true end-to-end probe needs a synthetic
# issue, which costs LLM spend per run and may be eaten by the Event Router's
# bot-sender filter. Out of scope until the error-class detection is proven.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Every 30 minutes. NOTE: scheduled runs only fire from the DEFAULT branch.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  N8N_HOST: https://gadgetlab.app.n8n.cloud
  # Event Router - the component that has broken twice. Webhook-driven, so a
  # long silence is itself a symptom (hook deleted / workflow deactivated).
  EVENT_ROUTER_ID: oijizIGJtRzBG94Z
  # DRC Agent Loop - error check only. A silence check here would be VACUOUS:
  # the 6-hourly health-check Pong pings always create executions, so DRC can
  # never look silent even when it is doing no real work.
  DRC_ID: Wlfhgk4sUfXJcU4D
  # Guaranteed nightly traffic: the autopilot daily-summary issue lands ~02:26
  # UTC and produces ~6 Event Router executions. 26h therefore spans at least
  # one guaranteed burst; anything shorter false-fires on quiet weekends.
  SILENCE_THRESHOLD_HOURS: '26'
  # Freshness window for hard failure + Slack paging. If the newest failure is
  # older than this, we downgrade to a warning (status=stale_incident, with the
  # failing execution id) so stale incidents do not keep the canary red forever
  # in quiet traffic windows. A stale incident is never reported as healthy.
  ALERT_WINDOW_MINUTES: '60'

jobs:
  canary:
    name: GitHub -> DRC intake canary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canary script
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/intake_canary.py
          sparse-checkout-cone-mode: false

      - name: Check n8n pipeline execution health
        id: probe
        # Logic and invariants live in .github/scripts/intake_canary.py, with
        # tests in tests/unit/test_intake_canary.py. Outputs: status (healthy |
        # stale_incident | pipeline_down | canary_broken), verdict, detail,
        # slack, evidence (one-line JSON). Stdlib only: nothing is installed.
        #
        # Freshness is judged PER WORKFLOW from that workflow's newest failure,
        # so a DRC-only failure is no longer gated on the router's timestamp.
        # A stale streak exits 0 with a warning and status=stale_incident; it
        # is never reported as healthy.
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: python3 .github/scripts/intake_canary.py

      - name: Alert Slack
        # Two distinct alert classes, because they need DIFFERENT hands:
        #   canary_broken -> a developer fixes the canary / rotates the key
        #   pipeline_down -> Gadget fixes credentials in the n8n UI
        # Folding them together costs a wasted escalation every time.
        if: failure() && steps.probe.outputs.slack == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL not set - job status is the only signal."
            exit 0
          fi

          if [ "$STATUS" = "canary_broken" ]; then
            HEADLINE=":wrench: *INTAKE CANARY BROKEN* - the canary cannot see the pipeline."
            ACTION="Needs a developer: the n8n API key is missing, expired, or rotated. Pipeline state is UNKNOWN, not healthy."
          else
            HEADLINE=":rotating_light: *GITHUB -> DRC INTAKE IS DOWN* - events are being dropped."
            ACTION="Needs Gadget in the n8n UI. Note: GitHub's webhook delivery log will still show 200 OK - that is expected and does NOT mean this is a false alarm."
          fi

          jq -n \
            --arg text "${HEADLINE}"$'\n\n'"${DETAIL}"$'\n\n'"${ACTION}"$'\n\n'"<${RUN_URL}|View run>" \
            '{text: $text}' \
          | curl -s -X POST -H 'Content-Type: application/json' \
              --max-time 20 -d @- "$SLACK_WEBHOOK_URL" \
          && echo "Slack alert sent." \
          || echo "::warning::Slack post failed - job status is the backstop."
