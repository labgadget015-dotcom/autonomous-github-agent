name: Test Coverage & Multi-Version Testing

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  MIN_COVERAGE: 80
  CACHE_VERSION: v2

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .pytest_cache
          key: ${{ runner.os }}-pytest-${{ env.CACHE_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pytest-${{ env.CACHE_VERSION }}-${{ matrix.python-version }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout coverage[toml]
      
      - name: Run tests with minimal discovery overhead
        run: |
          mkdir -p reports
          # Use pytest-xdist for parallel execution
          pytest .github/scripts \
            -v \
            --cov=.github/scripts \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:reports/htmlcov-${{ matrix.python-version }} \
            --cov-report=term \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --maxfail=5 \
            --timeout=300 \
            -n auto \
            || true
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.os }}
          path: reports/
          retention-days: 30

  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          path: all-coverage-reports/
      
      - name: Install coverage tools
        run: pip install coverage[toml] defusedxml
      
      - name: Combine coverage reports and generate summary
        id: coverage-summary
        run: |
          python3 << 'EOF'
          import os
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          reports_dir = Path('all-coverage-reports')
          summary = []
          summary.append('# 🧪 Test Coverage Report')
          summary.append('')
          
          total_coverage = 0
          coverage_count = 0
          
          for artifact_dir in reports_dir.iterdir():
              if artifact_dir.is_dir():
                  for coverage_file in artifact_dir.glob('coverage-*.xml'):
                      try:
                          tree = ET.parse(coverage_file)
                          root = tree.getroot()
                          
                          line_rate = float(root.attrib.get('line-rate', 0))
                          branch_rate = float(root.attrib.get('branch-rate', 0))
                          coverage_pct = line_rate * 100
                          
                          python_version = coverage_file.stem.replace('coverage-', '')
                          summary.append(f'## Python {python_version}')
                          summary.append(f'- **Line Coverage:** {coverage_pct:.1f}%')
                          summary.append(f'- **Branch Coverage:** {branch_rate * 100:.1f}%')
                          summary.append('')
                          
                          total_coverage += coverage_pct
                          coverage_count += 1
                      except Exception as e:
                          print(f'Error parsing {coverage_file}: {e}')
          
          if coverage_count > 0:
              avg_coverage = total_coverage / coverage_count
              summary.append(f'## 🎯 Average Coverage: {avg_coverage:.1f}%')
              summary.append('')
              
              min_coverage = float(os.getenv('MIN_COVERAGE', '80'))
              
              # Export for step outputs
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'coverage={avg_coverage:.1f}\\n')
                  f.write(f'passed={"true" if avg_coverage >= min_coverage else "false"}\\n')
              
              if avg_coverage < min_coverage:
                  summary.append(f'❌ **Coverage {avg_coverage:.1f}% is below threshold {min_coverage}%**')
                  summary.append('Please add more tests to improve coverage.')
                  summary.append('')
              else:
                  summary.append(f'✅ **Coverage {avg_coverage:.1f}% meets threshold {min_coverage}%**')
                  summary.append('')
          
          # Write to GitHub Step Summary
          summary_text = '\\n'.join(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary_text)
          
          # Save for PR comment
          with open('coverage-summary.md', 'w') as f:
              f.write(summary_text)
          
          print(summary_text)
          
          # Check if coverage threshold met
          if coverage_count > 0 and avg_coverage < min_coverage:
              sys.exit(1)
          EOF
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('coverage-summary.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary + '\\n\\n---\\n*Test coverage report. View detailed HTML reports in the [Actions artifacts](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ').*'
              });
            } catch (e) {
              console.log('Could not post comment:', e);
            }
      
      - name: Create issue if coverage below threshold
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('coverage-summary.md', 'utf8');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Test Coverage Below Threshold - ${new Date().toISOString().split('T')[0]}`,
                body: summary + '\\n\\n---\\n**Action Required:** Test coverage has fallen below acceptable thresholds.\\n[View Full Report](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')',
                labels: ['test-coverage', 'automated', 'urgent']
              });
            } catch (e) {
              console.log('Could not create issue:', e);
            }
