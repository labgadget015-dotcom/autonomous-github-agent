# Universal Acceleration & Innovation Protocol (UAIP) Configuration
# Use this YAML config for programmatic integration with CI/CD, automation tools, or project management systems

protocol:
  name: "Universal Acceleration & Innovation Protocol"
  version: "1.0"
  description: "Strategic framework for AI automation and development initiatives"

project_template:
  Project/Agent: "[Enter Name]"
  
  Objective_and_Leverage:
    description: "[Describe compounding outcomes, downstream benefits]"
    criteria:
      - "State outcome in terms of compounding advantage"
      - "List downstream benefits (time, risk, uniqueness, scale)"
  
  Automation:
    description: "[Manual tasks identified, automated, idempotency]"
    criteria:
      - "Manual tasks identified and scheduled for immediate automation"
      - "Idempotency and fault-tolerance by design"
  
  Interoperability_and_Reuse:
    description: "[Modular design, docs, reusable components]"
    criteria:
      - "Modular primitives (not scripts)"
      - "Clear interfaces and documentation"
  
  Feedback_Loops:
    description: "[Observability, metrics, adaptive feedback]"
    criteria:
      - "Observability/metrics from day one"
      - "Feedback loop/adaptation plan present"
  
  Benchmarking:
    description: "[Benchmarks, playbook codification]"
    criteria:
      - "Solution benchmarked vs. best in class/exemplars"
      - "Codified patterns, failures, and wins in a living playbook"
  
  Ecosystem_Leverage:
    description: "[External collab, OSS ready]"
    criteria:
      - "Ready for external collab/handoff"
      - "OSS/network effects enabled"
  
  Inspiration_and_Culture:
    description: "['What if?' mindset, radical alternatives reviewed]"
    criteria:
      - "'What if...' mindset; radical alternatives explored"
      - "Shared, prototyped, reviewed"
  
  Status_Notes: "[Ready/In Progress/Blocked/Notes]"

