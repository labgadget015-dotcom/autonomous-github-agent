# Code Standards Configuration
# Defines linting and code style rules

# Python Standards
python:
  # Linters
  linters:
    - black  # Code formatter
    - flake8  # Style guide enforcement
    - pylint  # Static analysis
    - mypy  # Type checking
    - bandit  # Security linting

  # Black configuration
  black:
    line_length: 100
    target_version: py311

  # Flake8 configuration
  flake8:
    max_line_length: 100
    ignore:
      - E203  # Whitespace before ':'
      - E501  # Line too long (handled by black)
      - W503  # Line break before binary operator
    max_complexity: 10

  # Pylint configuration
  pylint:
    max_line_length: 100
    disable:
      - C0111  # Missing docstring
      - R0903  # Too few public methods

  # MyPy configuration
  mypy:
    strict: true
    ignore_missing_imports: true
    warn_return_any: true
    warn_unused_configs: true

# JavaScript/TypeScript Standards
javascript:
  linters:
    - eslint
    - prettier

  eslint:
    extends:
      - eslint:recommended
      - plugin:@typescript-eslint/recommended
    rules:
      semi: error
      quotes: [error, single]
      indent: [error, 2]

# Go Standards
go:
  linters:
    - gofmt
    - golint
    - go vet

  gofmt:
    simplify: true

# Code Review Standards
review:
  # Minimum required approvals
  min_approvals: 1

  # Require review from code owners
  require_code_owners: true

  # Dismiss stale reviews on new commits
  dismiss_stale_reviews: true

  # Block merge if changes requested
  block_on_changes_requested: true

# Testing Standards
testing:
  # Minimum code coverage percentage
  min_coverage: 80

  # Require tests for new code
  require_tests: true

  # Test file patterns
  test_patterns:
    python: test_*.py
    javascript: "*.test.js"
    go: "*_test.go"

# Documentation Standards
documentation:
  # Require docstrings
  require_docstrings: true

  # Docstring style
  docstring_style: google  # or numpy, sphinx

  # Require README updates for new features
  require_readme_updates: true

  # API documentation format
  api_doc_format: markdown

# Commit Message Standards
commit:
  # Conventional commits
  use_conventional_commits: true

  # Commit types
  allowed_types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf

  # Maximum subject line length
  max_subject_length: 72

  # Require body for certain types
  require_body_for:
    - feat
    - fix
