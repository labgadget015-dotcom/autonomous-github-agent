_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: GadgetLab
  description: Pipeline status and repo health scans for your team
  background_color: "#0f172a"

features:
  bot_user:
    display_name: GadgetLab
    always_online: false
  slash_commands:
    - command: /gadgetlab
      url: https://gadgetlab.uk/api/slack/command
      description: Pipeline status and repo health scans
      usage_hint: "[status | scan owner/repo | help]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
