# Prometheus configuration for Autonomous GitHub Agent
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'autonomous-agent'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
  
  # Agent application metrics (if implemented)
  - job_name: 'agent'
    static_configs:
      - targets: ['agent:8000']
        labels:
          service: 'agent'
          app: 'autonomous-github-agent'
  
  # Docker daemon metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          service: 'docker'
