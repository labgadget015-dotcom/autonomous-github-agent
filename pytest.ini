[pytest]
# Pytest configuration for autonomous-github-agent

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Test output verbosity
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=autonomous_agent
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=55
    -p no:warnings

# Coverage options
[coverage:run]
source = autonomous_agent
omit =
    */tests/*
    */venv/*
    */site-packages/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
