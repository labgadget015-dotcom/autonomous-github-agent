[pytest]
# Pytest configuration for autonomous-github-agent

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 6.0

# Add current directory to PYTHONPATH
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Coverage options - optimized for speed
    --cov=.github/scripts
    --cov=tests
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-report=json
    # Fail if coverage below threshold
    --cov-fail-under=80
    # Exclude patterns from coverage
    --cov-config=.coveragerc
    # Warning options
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    # Parallel execution for speed
    -n auto
    # Distributed testing options
    --dist loadgroup
    # Stop after 3 failures for faster feedback
    --maxfail=3
    # Capture options - minimal overhead
    --tb=short
    # Show slowest tests
    --durations=10
    # Disable verbose plugin output
    --disable-warnings
    # Cache test results
    --cache-clear
    # Exit on first failure (for fast feedback)
    # --exitfirst  # Uncomment for rapid iteration

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    security: marks tests as security tests
    performance: marks tests as performance tests
    robustness: marks tests for robustness checks
    error_handling: marks tests for error handling

# Console output options
console_output_style = progress

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Fail on first error/failure
# Uncomment if you want fast feedback
# addopts = -x

# Run tests in parallel (requires pytest-xdist)
# Uncomment to enable parallel execution
addopts = -n auto

# Filterwarnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*U.*mode is deprecated:DeprecationWarning

# Coverage exclusions
[coverage:run]
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    .tox/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    pass
    \.\.\.

# Test report options
[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
