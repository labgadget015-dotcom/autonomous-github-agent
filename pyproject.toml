[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-github-agent"
version = "0.1.0"
description = "Autonomous AI system for end-to-end GitHub repository management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Autonomous Agent Team"}
]
keywords = ["github", "automation", "ai", "agent", "devops", "ci-cd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "PyGithub>=2.1.1",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "tiktoken>=0.5.2",
    "gitpython>=3.1.40",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "tenacity>=8.2.3",
    "asyncio>=3.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "pytest-mock>=3.12.0",
    "black>=23.12.1",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=3.6.0",
]

[project.scripts]
autonomous-agent = "autonomous_agent.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/autonomous-github-agent"
Documentation = "https://github.com/yourusername/autonomous-github-agent/docs"
Repository = "https://github.com/yourusername/autonomous-github-agent"
Issues = "https://github.com/yourusername/autonomous-github-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autonomous_agent*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use sys.path manipulation before imports (E402), capture results
# without always using them (F841), and use pytest.raises broadly (B017)
"tests/**" = ["E402", "F841", "B007", "B017", "N806", "E741", "E712"]
"tests/unit/**" = ["E402", "F841", "B007", "B017", "N806", "E741", "E712"]
# Install scripts have intentional mid-file imports
"INLINE_INSTALL.py" = ["E402"]
"FINAL_INSTALL.py" = ["E402"]
"RUN_INSTALLATION.py" = ["E402"]
"INSTALLATION_RUNNER.py" = ["E402"]
# MCP server uses str+Enum pattern and lambda id (intentional)
"mcp_server/**" = ["UP042", "A006", "E402", "F841"]
# Integration test scripts with mid-file setup
"scripts/**" = ["E402", "F841", "B007", "E741"]
# Example scripts with sys.path manipulation
"examples/**" = ["E402", "F841"]
# Install/setup scripts with mid-script imports
"execute_install.py" = ["E402"]
# Demo scripts use lambda id pattern and bare-except for import probing intentionally
"demo_ai_optimization.py" = ["A006"]
"test_env.py" = ["E402", "F841", "E722"]
# test_branch_protection probes import availability (F401 is intentional)
"tests/test_branch_protection.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_codes = ["import-untyped"]

[[tool.mypy.overrides]]
# These modules were written before strict type annotations were enforced.
# Disable strict checks until they can be fully annotated.
module = [
    "agents.*",
    "autopilot.*",
    "core.*",
    "overseer.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=autonomous_agent --cov=core --cov=agents --cov=overseer --cov=autopilot --cov-report=term-missing"

[tool.coverage.report]
fail_under = 70
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.pylint.typecheck]
# orjson is a compiled C extension; pylint can't introspect its members and
# falsely reports E1101 (no-member) on orjson.dumps/loads. Allow-list it.
extension-pkg-allow-list = ["orjson"]
